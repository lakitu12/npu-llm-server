name: Build and Verify NPU Plugin

on:
  push:
    branches: [master, main]
    paths:
      - 'plugin/**'
      - '.github/workflows/npu-plugin-build-verify.yaml'
  pull_request:
    branches: [master, main]
    paths:
      - 'plugin/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  # LiteRT upstream commit our local tree (/home/lakitu/src/litert) is pinned at;
  # plugin/multi-module-plugin.patch was produced against exactly this SHA.
  LITERT_SHA: 97411a900e644d5e270f9f3cbc756334466cc02b

jobs:
  build-plugin:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Setup bazelisk
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/bazelisk" https://github.com/bazelbuild/bazelisk/releases/download/v1.25.0/bazelisk-linux-amd64
          chmod +x "$RUNNER_TEMP/bin/bazelisk"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "USE_BAZEL_VERSION=7.7.0" >> "$GITHUB_ENV"

      - name: Checkout LiteRT upstream (pinned SHA)
        run: |
          git clone --quiet https://github.com/google-ai-edge/LiteRT "$RUNNER_TEMP/litert"
          git -C "$RUNNER_TEMP/litert" checkout --quiet "$LITERT_SHA"
          git -C "$RUNNER_TEMP/litert" rev-parse HEAD

      - name: Apply multi-module plugin patch
        run: |
          git -C "$RUNNER_TEMP/litert" apply --stat "$GITHUB_WORKSPACE/plugin/multi-module-plugin.patch"
          git -C "$RUNNER_TEMP/litert" apply "$GITHUB_WORKSPACE/plugin/multi-module-plugin.patch"
          echo "=== sanity: multi-module code present ==="
          grep -n "bytebuilders" "$RUNNER_TEMP/litert/litert/vendors/mediatek/compiler/compiler_plugin.cc" | head -8

      - name: Build plugin
        working-directory: ${{ runner.temp }}/litert
        run: bazelisk build //litert/vendors/mediatek/compiler:all --jobs=4 --verbose_failures 2>&1 | tail -25

      - name: Verify build artifacts exist
        working-directory: ${{ runner.temp }}/litert
        run: |
          SO=bazel-bin/litert/vendors/mediatek/compiler/libLiteRtCompilerPlugin_MediaTek.so
          test -f "$SO" || exit 1
          sha256sum "$SO" | tee "$SO.sha256"

      - name: dlopen + symbol smoke
        working-directory: ${{ runner.temp }}/litert
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-venv
          python3 -m venv "$RUNNER_TEMP/py"
          "$RUNNER_TEMP/py/bin/pip" install -q -r "$GITHUB_WORKSPACE/convert/ci-requirements.txt"
          "$RUNNER_TEMP/py/bin/python" - <<'PY'
          import ctypes
          so = ctypes.CDLL('bazel-bin/litert/vendors/mediatek/compiler/libLiteRtCompilerPlugin_MediaTek.so')
          for sym in ('LiteRtCompilerPluginCreate',
                      'LiteRtCompiledResultNumByteCodeModules',
                      'LiteRtGetCompiledResultByteCode',
                      'LiteRtGetCompiledResultCallInfo'):
              assert hasattr(so, sym), f'missing symbol {sym}'
          print('plugin dlopen + entry symbols OK')
          PY

      - name: Archive plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-build-artifacts
          path: |
            ${{ runner.temp }}/litert/bazel-bin/litert/vendors/mediatek/compiler/libLiteRtCompilerPlugin_MediaTek.so
            ${{ runner.temp }}/litert/bazel-bin/litert/vendors/mediatek/compiler/libLiteRtCompilerPlugin_MediaTek.so.sha256
          retention-days: 14
